<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign-Off · Memory graph</title>
<!-- The shared visual system (SCREEN's file: read here, never edited), then this page's layout. -->
<link rel="stylesheet" href="/screen/style.css">
<link rel="stylesheet" href="/graph/graph.css">
</head>
<body>
<div id="graph">
  <header class="top" id="top"><span class="brand">Sign-Off</span></header>
  <section class="band" id="band" aria-label="The item shown, and whose knowledge each mark stands for"></section>
  <main class="wrap">
    <section class="card chart" aria-label="What decides this item, left to right">
      <div class="heads" id="heads"></div>
      <div class="stage" id="stage"></div>
    </section>
    <aside class="card side" id="side" aria-label="One node, or Cognee's answer"></aside>
  </main>
</div>
