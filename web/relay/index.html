<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Live human check</title>
<style>
  /* The decision screen's tokens (web/screen/flow.css): white surface, hairline borders, radius 8, one type
     family, 14 px body, one accent (near-black), full-width primary button. */
  :root { --surface: #fff; --line: #e5e7eb; --t1: #111827; --t2: #4b5563; --t3: #9ca3af; --accent: #111827; --ok: #16a34a; --bad: #b42318;
          --f: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--surface); color: var(--t1); font: 400 14px/20px var(--f);
    -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  main { padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 28rem; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  header .brand { font-weight: 600; }
  .pill { font-size: 12px; line-height: 20px; padding: 0 8px; border: 1px solid var(--line); border-radius: 10px; color: var(--t2); }
  h1 { font: 600 20px/28px var(--f); margin: 16px 0 4px; }
  p { margin: 0 0 16px; color: var(--t2); }
  button { font: 600 14px/20px var(--f); width: 100%; min-height: 48px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--t1); cursor: pointer; touch-action: manipulation; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--t1); outline-offset: 2px; }
  #relay-container { margin-top: 16px; }
  #check { margin-top: 12px; }
  .card { margin-top: 16px; border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .card .head { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .card .head .mark { font-weight: 600; }
  .card.ok .mark { color: var(--ok); } .card.bad .mark { color: var(--bad); }
  .card .meta { margin: 8px 0 0; color: var(--t2); font-size: 13px; line-height: 18px; }
  #note { margin-top: 12px; color: var(--t2); }
  #note.bad { color: var(--bad); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header><span class="brand">Sign-Off</span><span class="pill">Sandbox</span></header>
  <h1>Live human check</h1>
  <p>Confirms that a person, not the agent, is signing. In the sandbox the result is simulated.</p>
  <button id="go" class="primary">Start the check</button>
  <div id="relay-container"></div>
  <button id="check" hidden>I finished the check</button>
  <div id="note" role="status" aria-live="polite"></div>
  <section id="card" class="card" hidden aria-live="polite">
    <div class="head"><span class="mark" id="mark"></span><span id="verdict"></span></div>
    <p class="meta" id="meta"></p>
  </section>
</main>
<script type="module">
const $ = (id) => document.getElementById(id);
const go = $("go"), check = $("check"), note = $("note"), card = $("card");
const post = (path) => fetch(path, { method: "POST" }).then((r) => r.json());
const say = (text, bad = false) => { note.textContent = text; note.className = bad ? "bad" : ""; };

async function redeem() {
  say("Checking…");
  for (let i = 0; i < 20; i++) {
    const r = await post("/api/issuer/relay/complete");
    if (r.pending) { await new Promise((ok) => setTimeout(ok, 1500)); continue; }
    if (!r.ok) { say("Could not finish: " + (r.error || "unknown"), true); go.disabled = false; return; }
    const passed = r.result === "passed";
    say("");
    card.hidden = false; card.className = "card " + (passed ? "ok" : "bad");
    $("mark").textContent = passed ? "✓" : "✕";
    $("verdict").textContent = passed ? "Live human: passed (sandbox)" : "Live human: failed (sandbox)";
    $("meta").textContent = "Claim " + r.claim_type + ", " + r.at + ". Sandbox claims are simulated.";
    $("relay-container").replaceChildren(); check.hidden = true; go.hidden = true;
    return;
  }
  say("Not finished yet. Start again.", true);
  go.disabled = false;
}

check.addEventListener("click", () => { check.hidden = true; redeem(); });

go.addEventListener("click", async () => {
  go.disabled = true; check.hidden = true; card.hidden = true; say("");
  let session;
  try { session = await post("/api/issuer/relay/start"); } catch { session = { ok: false }; }
  if (!session.ok) { say("Could not start: " + (session.error || "no connection"), true); go.disabled = false; return; }
  try {
    const { default: Relay } = await import("https://cdn.jsdelivr.net/npm/@persona/relay@0.2.2/+esm");
    new Relay("#relay-container", {
      accessToken: session.access_token, theme: "light",
      onComplete: () => { check.hidden = true; redeem(); },
      onExpire: () => { say("The session ended. Start again.", true); go.disabled = false; },
      onError: (e) => { say("Could not show the check: " + ((e && (e.message || e.code)) || "error"), true); go.disabled = false; },
    });
    check.hidden = false;
  } catch (e) {
    say("Could not load the check. ", true);
    const a = document.createElement("a");
    a.href = session.hosted_url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = "Open it on Persona's page";
    note.append(a);
    go.disabled = false;
  }
});
</script>
</body>
</html>
