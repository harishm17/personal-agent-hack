<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign-Off · Signature</title>
<!-- The shared visual system (SCREEN's file: read here, never edited), then this page's layout. -->
<link rel="stylesheet" href="/screen/style.css">
<link rel="stylesheet" href="/seal/seal.css">
</head>
<body>
<div id="seal">
  <header class="top" id="top"><span class="brand">Sign-Off</span></header>
  <main class="wrap">
    <section class="card lanes" id="lanes" aria-label="Who holds what"></section>
    <section class="card covers" aria-label="What the signature covers, and the check">
      <div class="cols" id="rows"></div>
      <aside class="print" id="print">
        <div class="cap">One fingerprint · SHA-256 of every row</div>
        <div class="fp"><div class="pat" id="pat" aria-hidden="true"></div><div class="codes" id="codes"></div></div>
        <div id="cover"></div>
        <div class="cap">3 · Change one thing</div>
        <div id="status"></div>
      </aside>
      <div class="cap foot">Click any value to change it in a copy. Real cryptography on the real signature, done in this browser without trusting our server.</div>
    </section>
  </main>
</div>
<script type="module" src="/seal/seal.js"></script>
</body>
</html>
