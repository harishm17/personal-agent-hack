<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign-Off</title>
<link rel="stylesheet" href="/screen/style.css">
</head>
<body>
<!-- A 960 x 540 canvas, scaled to the window (200% on a 1920 x 1080 projector). Everything is drawn from /api/state. -->
<main id="stage">
  <header id="head"></header>
  <div id="trail" aria-label="The steps the agent took on this line"></div>
  <section id="main"></section>
  <nav id="tiles" aria-label="The sheet: every line"></nav>
  <footer id="seal" aria-live="polite"></footer>
  <div id="fly" aria-hidden="true"></div>
  <p id="wait">Waiting for <a href="/api/state">/api/state</a></p>
</main>
<script type="module" src="/screen/app.js"></script>
</body>
</html>
