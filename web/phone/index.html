<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Sign-Off</title>
<style>
  /* The decision screen's tokens (web/screen/flow.css): one family, 14 px body, weights 400 and 500, 8 px grid,
     hairline borders, radius 8, three greys, one accent (the ink), white surface on a pale ground. */
  :root { --bg:#f7f8fa; --surface:#fff; --line:#e5e7eb; --t1:#111827; --t2:#4b5563; --t3:#9ca3af; --accent:#111827;
          --ok:#16a34a; --bad:#b42318; --f:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--t1); font:400 14px/20px var(--f);
               font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; }
  body { padding:48px 0 calc(56px + env(safe-area-inset-bottom)); }
  .top { position:fixed; top:0; left:0; right:0; height:48px; display:flex; align-items:center; gap:8px; padding:0 16px; background:var(--surface); border-bottom:1px solid var(--line); z-index:5; white-space:nowrap; }
  .top h1 { margin:0; font:500 14px/20px var(--f); overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
  .pill { font-size:12px; line-height:20px; padding:0 8px; border:1px solid var(--line); border-radius:10px; color:var(--t2); background:var(--surface); flex:none; }
  .pill:empty { display:none; }
  nav { position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); z-index:5; }
  nav button { flex:1; height:56px; border:0; background:none; color:var(--t2); font:500 14px/20px var(--f); }
  nav button[aria-selected="true"] { color:var(--t1); box-shadow:inset 0 2px 0 var(--accent); }
  main { padding:16px; max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:8px; }
  main.center { min-height:calc(100dvh - 48px - 56px); justify-content:center; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .item { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; justify-content:space-between; gap:16px; align-items:baseline; }
  .need { font-weight:500; }
  .num { font-weight:500; white-space:nowrap; }
  .sub { color:var(--t2); }
  .cap { font-size:12px; line-height:16px; color:var(--t3); }
  .pick { overflow-wrap:anywhere; }
  .lim { display:block; width:100%; text-align:left; border:0; background:none; padding:0; font:400 14px/20px var(--f); color:var(--t2); min-height:24px; }
  .lim b { color:var(--t1); font-weight:500; }
  .lim .src { color:var(--t3); }
  .pref { padding:4px 0 4px 10px; margin-top:4px; border-left:2px dotted var(--t3); color:var(--t2); font-size:14px; }
  .pref .src { color:var(--t3); }
  .lim.changed .src { color:var(--t1); font-weight:500; text-decoration:underline; text-underline-offset:3px; }
  .quote { margin:4px 0 0; padding-left:8px; border-left:1px solid var(--line); color:var(--t2); overflow-wrap:anywhere; }
  .total { font:500 20px/28px var(--f); }
  .code { font:600 20px/28px ui-monospace, Menlo, monospace; color:var(--t1); letter-spacing:.02em; }
  .hash { font:12px/16px ui-monospace, Menlo, monospace; color:var(--t2); overflow-wrap:anywhere; }
  .stack { display:flex; flex-direction:column; gap:4px; }
  .rule { border-top:1px solid var(--line); }
  button.act { height:44px; padding:0 16px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--t1); font:500 14px/20px var(--f); }
  button.act:active { border-color:var(--t2); }
  button.act.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.act.big { width:100%; }
  button.act.danger { color:var(--bad); border-color:var(--bad); }
  button.act:disabled { opacity:.4; }
  button.link { border:0; background:none; padding:0; color:var(--t1); font:500 14px/20px var(--f); text-decoration:underline; text-underline-offset:3px; }
  button:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible { outline:2px solid var(--t1); outline-offset:2px; border-radius:4px; }
  .asks { display:flex; flex-direction:column; gap:8px; } .asks:empty { display:none; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  input[type=text] { width:100%; height:44px; font:400 14px/20px var(--f); padding:0 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--t1); }
  input[type=range] { width:100%; height:32px; accent-color:var(--accent); margin:0; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chips button { height:32px; padding:0 12px; border:1px solid var(--line); border-radius:16px; background:var(--surface); color:var(--t1); font:400 14px/20px var(--f); }
  .tag { font-size:12px; line-height:16px; font-weight:500; color:var(--t2); }
  .tag.ok { color:var(--ok); } .tag.bad { color:var(--bad); }
  details summary { cursor:pointer; color:var(--t1); font-weight:500; min-height:24px; }
  details[open] summary { margin-bottom:4px; }
  ul.plain { list-style:none; margin:0; padding:0; }
  ul.plain li { padding:8px 0; border-top:1px solid var(--line); }
  ul.plain li:first-child { border-top:0; }
  .big-v { font:500 20px/28px var(--f); }
  #toast { position:fixed; left:16px; right:16px; top:56px; max-width:448px; margin:0 auto; background:var(--t1); color:#fff; padding:12px 16px; border-radius:8px; z-index:9; display:none; }
  a { color:var(--t1); text-underline-offset:3px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header class="top">
  <h1 id="h1">Sign-Off</h1>
  <span class="pill" id="who"></span>
</header>
<main id="main" aria-live="polite" hidden></main>
<nav id="nav" role="tablist" hidden>
  <button role="tab" data-tab="sheet" aria-selected="true">Sheet</button>
  <button role="tab" data-tab="lines" aria-selected="false">Items</button>
  <button role="tab" data-tab="adjust" aria-selected="false">Adjust a limit</button>
</nav>
<div id="toast" role="status"></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = (c) => (c == null ? "" : "$" + (c / 100).toFixed(2));
const when = (iso) => { const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); };
const fmt = (v) => (Number.isInteger(v) ? String(v) : String(Math.round(v * 100) / 100));

/* ---------- the signing key: not extractable, kept in IndexedDB ---------- */
const DB = { name: "signoff-phone", store: "kv" };
function idb() {
  return new Promise((resolve, reject) => {
    const open = indexedDB.open(DB.name, 1);
    open.onupgradeneeded = () => open.result.createObjectStore(DB.store);
    open.onsuccess = () => resolve(open.result);
    open.onerror = () => reject(open.error);
  });
}
async function kvGet(key) { const db = await idb(); return new Promise((res, rej) => { const r = db.transaction(DB.store).objectStore(DB.store).get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function kvSet(key, value) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(DB.store, "readwrite"); tx.objectStore(DB.store).put(value, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

/* Wording the sheet may choose for its own setting (sheet.vocab): the word for a limit, for the order document, the total
   and the nav's second tab. Names, roles and units are always read from the sheet itself. */
const V = (k, d) => (state && state.sheet && state.sheet.vocab && state.sheet.vocab[k]) || d;
const O = () => V("order", "order"), LIM = () => V("limit", "limit");
const shopperName = () => (state && state.sheet && state.sheet.shopper && state.sheet.shopper.name) || "the shopper";
let keyRec = null;      // { privateKey, jwk, key_id|null, seq }
let issuer = null;      // { enrolled, key_id, name, persona, senso }
let state = null, persona = null, canon = null, notice = "", lastSheetId = null;
let tab = "sheet", signed = false, busy = false, openLimit = null;
let lastKey = null, armedUntil = 0, armedHash = null, signNote = "";
/* arm:start */
function armed(now, until, armedFor, current) { return now < until && !!armedFor && armedFor === current; }   // armed only for the sheet that was on screen at the first tap
/* arm:end */
const shown = new Set();   // limit ids whose order sentence is open
const dragging = new Set();

async function ensureKey() {
  keyRec = await kvGet("key");
  if (!keyRec) {
    const pair = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, false, ["sign", "verify"]);
    const jwk = await crypto.subtle.exportKey("jwk", pair.publicKey);
    keyRec = { privateKey: pair.privateKey, jwk: { kty: jwk.kty, crv: jwk.crv, x: jwk.x, y: jwk.y }, key_id: null, seq: 0 };
    await kvSet("key", keyRec);
  }
}
async function signedRequest(type, fields) {
  keyRec.seq = Math.max(keyRec.seq + 1, Date.now());
  await kvSet("key", keyRec);
  const payload = JSON.stringify({ type, sheet_id: state.sheet.id, seq: keyRec.seq, at: new Date().toISOString(), ...fields });
  const sig = await crypto.subtle.sign({ name: "ECDSA", hash: "SHA-256" }, keyRec.privateKey, new TextEncoder().encode(payload));
  const res = await fetch("/api/issuer/request", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ payload, sig: b64u(sig), key_id: keyRec.key_id }) });
  let body = {};
  try { body = await res.json(); } catch (e) { /* not JSON */ }
  if (!res.ok || body.ok === false) { const err = new Error(body.detail || ("HTTP " + res.status)); err.code = body.error; throw err; }
  return body;
}
async function keyIdOf(jwk) {
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(jwk.x + "." + jwk.y));
  return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, "0")).join("").slice(0, 16);
}

/* ---------- small helpers ---------- */
let toastTimer;
function toast(text, ms = 6000) { const t = $("#toast"); t.textContent = text; t.style.display = "block"; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.style.display = "none"), ms); }
async function getJSON(url, opts) { const r = await fetch(url, opts); if (!r.ok) throw new Error(url + " " + r.status); return r.json(); }
const lineOf = (id) => state.lines.find((l) => l.line_id === id);
const pickOf = (line) => (line && line.pick ? line.candidates.find((c) => c.id === line.pick) : null);
const hashNow = () => canon && canon.hash;               // computed on this phone from the canonical sheet
const serverHashNow = () => canon && canon.serverHash;   // what the server says (Senso verdicts are keyed by it)
const mine = () => issuer && issuer.enrolled && keyRec && keyRec.key_id === issuer.key_id;

/* the fingerprint as the laptop and /seal/ show it: the first twelve characters in groups of four, large; the whole value is behind a tap */
const shortCode = (h) => (h || "").slice(0, 12).replace(/(.{4})(?=.)/g, "$1 ");
function codeBlock(full) { return `<div class="code">${esc(shortCode(full))}</div><details><summary>Full code</summary><div class="hash">${esc(full || "")}</div></details>`; }

/* ---------- boot ---------- */
async function boot() {
  if (!window.crypto || !crypto.subtle || !window.indexedDB) {
    show('<div class="card"><div class="need">This page needs a secure address</div><div class="sub">Signing keys only work on https or localhost. Open the address of the tunnel.</div></div>', true);
    return;
  }
  try { await ensureKey(); } catch (e) { show('<div class="card"><div class="need">No key storage</div><div class="sub">This browser would not keep a key (private window?). Open the page in a normal tab.</div></div>', true); return; }
  await refreshIssuer();
  if (issuer.enrolled && keyRec.key_id !== issuer.key_id) {
    keyRec.key_id = null;
    const id = await keyIdOf(keyRec.jwk);
    if (id === issuer.key_id) { keyRec.key_id = id; await kvSet("key", keyRec); }
  }
  await loadState();
  lastSheetId = state.sheet.id;
  if (keyRec.was && !mine()) notice = "A new run started: scan the code on the laptop again.";
  startEvents();
  render();
}
async function refreshIssuer() { issuer = await getJSON("/api/issuer/status"); }
async function sha256hex(text) {
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
/* Display binding: what is shown is rendered from the canonical sheet, and what is signed is the hash this phone
   computed from that exact string. If the server's hash differs from ours, we do not sign. */
async function loadState() {
  state = await getJSON("/api/state"); signed = !!(state.seal && state.seal.signed);
  try {
    const c = await getJSON("/api/sheet/canonical");
    const mine = await sha256hex(c.canonical);
    canon = { text: c.canonical, obj: JSON.parse(c.canonical), hash: mine, serverHash: c.sheet_hash, match: mine === c.sheet_hash };
  } catch (e) { canon = null; }
  if (armedHash && (!canon || canon.hash !== armedHash)) { armedUntil = 0; armedHash = null; }   // the sheet changed: the armed tap is void at once
}
function startEvents() {
  let pending = false, again = false;
  const refetch = async () => {
    if (pending) { again = true; return; }
    pending = true;
    try { await loadState(); await refreshIssuer(); if (runChanged()) render(); else { renderLive(); paintAsks(); } } catch (e) { /* offline blip */ }
    pending = false; if (again) { again = false; refetch(); }
  };
  // One stream per visible page: a browser allows six connections to one host, so a hidden page closes its
  // stream and reopens it when shown. Polling below covers a stream that cannot open.
  let evt = null;
  const openStream = () => { if (evt || document.hidden) return; try { evt = new EventSource("/api/events"); evt.onmessage = refetch; } catch (e) { evt = null; } };
  const closeStream = () => { if (evt) { evt.close(); evt = null; } };
  document.addEventListener("visibilitychange", () => { if (document.hidden) closeStream(); else { openStream(); refetch(); } });
  addEventListener("pagehide", closeStream);
  openStream();
  setInterval(() => { if (!document.hidden) refetch(); }, 3000);
}

/* ---------- the shopper's ask (G23): a card for each pending ask, on every tab; accepting is her own signed limit change ---------- */
function asksHtml() {
  if (!issuer || !issuer.enrolled || !mine() || signed) return "";
  return (issuer.asks || []).filter((a) => a.status === "pending").map((a) => `<div class="card ask">
    <div class="cap">${esc(a.by)} asks you to change a ${esc(LIM())}</div>
    <div class="pick">${esc(a.text)}</div>
    ${a.note ? `<div class="quote">“${esc(a.note)}”</div>` : ""}
    <div class="btns"><button class="act primary" data-ask-accept="${esc(a.id)}">Accept</button><button class="act" data-ask-decline="${esc(a.id)}">Decline</button></div></div>`).join("");
}
function paintAsks() {
  const el = $("#asks"); if (!el || el.querySelector("button:disabled")) return;
  const h = asksHtml(); if (el.dataset.h !== h) { el.innerHTML = h; el.dataset.h = h; }
}
async function answerAsk(button, type, fields) {
  button.closest(".ask").querySelectorAll("button").forEach((b) => (b.disabled = true));
  try { await signedRequest(type, fields); await loadState(); await refreshIssuer(); render(); }
  catch (err) { handleError(err); await refreshIssuer().catch(() => {}); render(); }
}

/* ---------- render ---------- */
function show(html, center = false) { const m = $("#main"); m.innerHTML = (center ? "" : '<div id="asks" class="asks">' + asksHtml() + "</div>") + html; m.hidden = false; m.classList.toggle("center", center); return m; }
function head() {
  $("#h1").textContent = state ? state.sheet.title : "Sign-Off";
  if (!issuer.enrolled || !mine()) return;
  $("#who").textContent = issuer.name + " · key " + issuer.key_id.slice(0, 6) + (signed ? " · signed" : "");
}
function labelNav() { const a = document.querySelector('nav button[data-tab="adjust"]'), l = document.querySelector('nav button[data-tab="lines"]'); if (a) a.textContent = "Adjust a " + LIM(); if (l) l.textContent = V("items", "Items"); }
/* A reset or a switch of the sheet on the laptop wipes the enrolment: say so plainly, never a silent broken state. */
function runChanged() {
  let changed = false;
  if (keyRec && keyRec.key_id && !issuer.enrolled) { notice = "A new run started: scan the code on the laptop again."; keyRec.key_id = null; keyRec.seq = 0; kvSet("key", keyRec); changed = true; }
  else if (keyRec && keyRec.key_id && issuer.enrolled && keyRec.key_id !== issuer.key_id) { notice = "A new run started with another phone: " + issuer.name + "'s phone signs now."; keyRec.key_id = null; kvSet("key", keyRec); changed = true; }
  if (state && state.sheet && lastSheetId && state.sheet.id !== lastSheetId) { lastSheetId = state.sheet.id; if (!notice) notice = "The sheet changed: a new run started."; lastKey = null; changed = true; }
  return changed;
}
function render() {
  const name = state && state.sheet && state.sheet.issuer ? state.sheet.issuer.name : "";
  head();
  if (!issuer.enrolled) return renderEnrol(name);
  if (!mine()) return renderNotMine();
  $("#nav").hidden = false; labelNav();
  if (tab === "sheet") renderSheet(); else if (tab === "lines") renderLines(); else renderAdjust();
}
function renderLive() {
  if (!mine()) return;
  head();
  if (tab === "sheet") { const key = [state.version, canon && canon.hash, issuer && issuer.senso && issuer.senso.for_hash, sensoRunning].join("|"); if (!busy && key !== lastKey) { lastKey = key; renderSheet(); } }
  else if (tab === "lines") { if (!document.activeElement || document.activeElement.tagName !== "INPUT") renderLines(); }
  else updateAdjust();
}
function renderEnrol(name) {
  $("#nav").hidden = true;
  $("#who").textContent = "";
  show(`<div class="card">${notice ? `<div class="need" role="alert">${esc(notice)}</div>` : ""}<div class="need">Use this phone to sign</div>
    <div class="sub">This phone holds the signing key.</div>
    <label class="stack"><span class="cap">Name on the seal</span><input type="text" id="nm" value="${esc(name)}" autocomplete="name"></label>
    <label class="stack"><span class="cap">Code from the laptop</span><input type="text" id="code" value="${esc(new URLSearchParams(location.search).get("code") || "")}" autocomplete="off" autocapitalize="off" inputmode="text"></label>
    <button class="act primary big" id="enrol">Enrol this phone</button></div>`, true);
  $("#enrol").onclick = async () => {
    $("#enrol").disabled = true;
    try {
      const r = await fetch("/api/issuer/enroll", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ public_key_jwk: keyRec.jwk, name: $("#nm").value, code: $("#code").value.trim() }) });
      const body = await r.json();
      if (!r.ok) throw new Error(body.detail || r.status);
      keyRec.key_id = body.key_id; keyRec.seq = 0; keyRec.was = true; notice = ""; await kvSet("key", keyRec);
      history.replaceState(null, "", location.pathname);
      await refreshIssuer(); await loadState(); render();
    } catch (e) { toast("Not enrolled: " + e.message); $("#enrol").disabled = false; }
  };
}
function renderNotMine() {
  $("#nav").hidden = true;
  $("#who").textContent = "";
  show(`<div class="card">${notice ? `<div class="need" role="alert">${esc(notice)}</div>` : ""}<div class="need">${esc(issuer.name)}'s phone signs</div>
    <div class="sub">This phone can look but not sign. To start over, reset from the laptop and enrol this phone instead.</div></div>`, true);
}
/* limit helpers: the numbers come from the canonical sheet, the wording and the order's sentence from the sheet file */
function sheetLimit(id) { for (const line of state.sheet.lines) for (const l of line.limits) if (l.id === id) return l; return null; }
function stateCandidate(pick) {
  for (const L of state.lines) for (const c of L.candidates) if (c.product.variant_id === pick.variant_id && c.product.store === pick.store) return c;
  return null;
}
const OPS = { ">=": "at least", "<=": "at most" };
function limitRowC(l) {
  const sl = sheetLimit(l.id), label = sl ? sl.label : l.id;
  let src = "from the home", changed = false, quote = "A measurement of the home.";
  if (l.set_by === "issuer") {
    const fo = sl && sl.from_order;
    if (fo && Math.abs(fo.value - l.bound) > 1e-9) { src = "changed from the " + O(); changed = true; quote = (fo.quote ? "“" + fo.quote + "” The " + O() + " says " + fmt(fo.value) + " " + l.unit + "." : "The " + O() + " says " + fmt(fo.value) + " " + l.unit + "."); }
    else if (fo) { src = "from the " + O(); quote = fo.quote ? "“" + fo.quote + "”" : "The text of the " + O() + " is not available here."; }
    else { src = "set before the " + O(); quote = "No sentence from the " + O() + " is attached to this " + LIM() + "."; }
  }
  const open = shown.has(l.id);
  return `<button class="lim ${changed ? "changed" : ""}" data-lim="${esc(l.id)}" aria-expanded="${open}">${esc(label)} <b class="num">${fmt(l.bound)} ${esc(l.unit)}</b> <span class="src">· ${esc(src)}</span></button>` +
    (open ? `<div class="quote">${esc(quote)}</div>` : "");
}
/* ordering-and-preferences:start */
/* the ordering the shopper chose, in the approver's words; the id and label are the signed ones, who set it is read from the state only when it is the same rule */
function ruleText(c) {
  const r = c.pick_rule; if (!r) return "";
  const label = typeof r === "string" ? r : (r.label || r.id || JSON.stringify(r)), id = typeof r === "string" ? r : r.id;
  const sr = state && state.sheet && state.sheet.pick_rule;
  return sr && sr.id === id && sr.set_by === shopperName() ? shopperName() + " asked for " + label : "Pick rule: " + label;
}
/* a preference: the same shape as a limit, shown quietly and never adjustable; it never rejects a product */
function sheetPref(id) { for (const line of state.sheet.lines) for (const p of line.preferences || []) if (p.id === id) return p; return null; }
function prefRowC(p) {
  const sp = sheetPref(p.id), word = (sp && sp.label) || OPS[p.op] || p.op;
  return `<div class="pref">prefers ${esc(word)} <b class="num">${fmt(p.bound)} ${esc(p.unit || "")}</b> <span class="src">· a preference, not a ${esc(LIM())}</span></div>`;
}
/* ordering-and-preferences:end */
function itemCard(L, c) {
  const p = L.pick;
  const head = `<div class="row"><span class="need">${esc(L.need)}</span><span class="num">${p && L.status !== "pick_up" ? money(p.price_cents * (p.quantity || 1)) : ""}</span></div>`;
  let body;
  if (L.status === "pick_up") body = `<div class="pick sub">pick up locally, not in a cart</div>`;
  else if (!p) body = `<div class="pick sub">no pick: ${esc(L.status)}</div>`;
  else {
    const cand = stateCandidate(p), title = p.title || (cand && cand.product.title) || p.product_key;
    const variant = p.variant_title && p.variant_title !== "Default Title" ? " · " + p.variant_title : "";   // a product with one variant has no variant to name
    body = `<div class="pick">${esc(title)}</div><div class="sub">${esc(p.store)}${esc(variant)}${(p.quantity || 1) !== 1 ? " · × " + esc(p.quantity) : ""}</div>`;
  }
  const limits = (L.limits || []).map(limitRowC).join("");
  const prefs = (L.preferences || []).map(prefRowC).join("");
  const why = p && L.status !== "pick_up" ? `<details data-why="${esc(L.line_id)}" ><summary>Why this one</summary>
      ${(p.checks || []).length ? `<ul class="plain">${p.checks.map((k) => `<li>${esc(k.expr)}</li>`).join("")}</ul>` : ""}
      ${(p.quotes || []).map((q) => `<div class="quote">the store states: “${esc(q)}”</div>`).join("")}
      ${p.delivery && p.delivery.quote ? `<div class="quote">delivery: “${esc(p.delivery.quote)}”${p.delivery.need_by ? " · needed by " + esc(p.delivery.need_by) : ""}</div>` : ""}
      ${(L.struck || []).length ? `<div class="sub">struck here: ${esc(L.struck.join(", "))}</div>` : ""}</details>` : (L.struck || []).length ? `<div class="sub">struck here: ${esc(L.struck.join(", "))}</div>` : "";
  return `<div class="item">${head}<div class="stack">${body}</div><div class="stack">${limits}${prefs}</div>${why}</div>`;
}
const openWhy = new Set();

/* sheet: what is being signed, then one button */
let sensoRunning = false, sensoFor = null;
function sensoLine() {
  const s = (issuer && issuer.senso) || {};
  if (s.configured === false) return { text: "Senso is not connected", rows: [] };
  const fresh = s.for_hash && s.for_hash === serverHashNow();
  if (!sensoRunning && !fresh && s.error && !s.running) return { text: "not checked: Senso not reachable", rows: [] };
  if (sensoRunning || !fresh) return { text: "Checking the sheet against the " + O() + "…", rows: [] };
  const rows = s.checks || [], ok = rows.filter((r) => r.verdict === "verified").length;
  if (!rows.length) return { text: "Nothing to check against the " + O() + " yet", rows };
  const vs = (s.order_document && s.order_document.versions) || [];
  const ver = vs.length === 1 ? " (version " + (vs[0].version_num || String(vs[0].version_id).slice(0, 8)) + ")" : "";
  return { text: "Checked against the " + O() + ver + ": " + ok + " of " + rows.length + " verified" + ((s.blocking || []).length ? ", " + s.blocking.length + " stop the signature" : ""), rows };
}
async function ensureSenso() {
  const s = issuer && issuer.senso;
  if (sensoRunning || !serverHashNow() || !s || s.configured === false || s.for_hash === serverHashNow() || sensoFor === serverHashNow()) return;
  sensoRunning = true; sensoFor = serverHashNow();
  try {
    await fetch("/api/senso/run", { method: "POST" });          // returns at once; the server runs it in the background
    for (let i = 0; i < 45 && issuer.senso.for_hash !== serverHashNow(); i++) { await new Promise((r) => setTimeout(r, 2000)); await refreshIssuer(); }
  } catch (e) { /* the server signs with the check marked pending */ }
  sensoRunning = false;
  if (tab === "sheet" && !busy) renderSheet();
}
/* senso-seal-text:start */
function sensoSealText(sg, word) {
  const s = sg && sg.senso, o = word || "order";
  if (!s) return "not checked: no Senso result on this signature";
  if (s.status === "pending") return "Senso check still running";
  if (s.status === "not_connected") return "not checked: Senso is not connected";
  if (s.status === "unavailable") return "not checked: Senso not reachable";
  if (s.status !== "complete") return "not checked";
  const rows = s.checks || [];
  if (!rows.length) return "nothing to check against the " + o;
  const n = (v) => rows.filter((r) => r.verdict === v).length;
  const ok = n("verified"), bad = n("error"), diff = n("conflict"), unsup = rows.length - ok - bad - diff;
  const vs = {};
  rows.forEach((r) => { if (r.source && r.source.version_id) vs[r.source.version_id] = r.source.version_num || String(r.source.version_id).slice(0, 8); });
  const ids = Object.keys(vs), ver = ids.length === 1 ? " (version " + vs[ids[0]] + ")" : "";
  return "Checked against the " + o + ver + ": " + ok + " of " + rows.length + " verified" + (diff ? ", " + diff + (diff === 1 ? " differs" : " differ") + " from the " + o : "") +
    (unsup ? ", " + unsup + " not supported by the " + o : "") + (bad ? ", " + bad + " not checked (Senso did not answer)" : "");
}
/* senso-seal-text:end */
function renderSheet() {
  const seal = state.seal || {};
  if (signed) {
    const who = (seal.signature && seal.signature.name) || "";
    show(`<div class="card"><div class="cap">Signed</div><div class="big-v">${esc(who)}</div>
      <div class="sub">${esc(when((seal.signature && seal.signature.at) || ""))}</div>
      ${codeBlock(seal.sheet_hash)}</div>
      <div class="card"><div class="cap">Carts</div><ul class="plain">${(seal.carts || []).map((c) => `<li class="stack"><div class="row"><span>${esc(c.store)}</span><span class="num">${money(c.total_cents)}</span></div>${c.total_differs || c.line_differences ? `<div class="sub" style="color:var(--bad)">${esc(c.note)}</div>` : (c.cart_url ? `<div class="sub">${c.lines_checked ? "the store's cart lines match the signed picks" : "the store's cart lines were not compared"}</div>` : "")}${c.cart_url ? `<div><a href="${esc(c.cart_url)}" target="_blank" rel="noopener">Open the cart</a> ${c.mode === "replay" ? '<span class="sub">· a saved copy, not the store\'s live cart</span>' : ""}</div>` : `<span class="sub">${c.mode === "pending" ? "still being created at the store" : "not created: " + esc(c.note || "")}</span>`}</li>`).join("")}</ul></div>
      <div class="card"><div class="cap">Checks</div>
      <div class="sub">${(() => { const q = (seal.signature && seal.signature.persona) || {}; return q.inquiry_id ? esc(q.label || "") : "identity not checked"; })()}</div>
      ${seal.signature && seal.signature.relay ? `<div class="sub">Live human: ${esc(seal.signature.relay.result)} (sandbox: a sandbox claim passes with nobody present)</div>` : ""}
      <div class="sub">${esc(sensoSealText(seal.signature, O()))}</div></div>
      <div class="sub">To start over, reset from the laptop.</div>`);
    return;
  }
  if (!canon) { show('<div class="card"><div class="need">The sheet could not be loaded</div><div class="sub">Trying again.</div></div>', true); return; }
  const per = persona || (issuer && issuer.persona) || { label: "identity not checked" };
  const sl = sensoLine(), c = canon.obj;
  const buyable = c.lines.filter((L) => L.status === "ready" || L.status === "next_candidate").length;
  show(c.lines.map((L) => itemCard(L, c)).join("") +
    `<div class="card"><div class="stack"><div class="cap">${esc(V("total", "Total in carts"))}</div><div class="total">${money(c.total_cents)}</div><div class="sub">${esc(ruleText(c))}</div></div>
    <div class="rule"></div>
    <div class="stack"><div class="cap">Checks</div>
    <div class="sub">${esc(per.label || "identity not checked")}${issuer.identity_required && !per.verified ? " · needed to sign" : ""} · <button class="link" id="pstart">${per.inquiry_id ? "refresh" : "check identity"}</button>${per.link ? ` · <a href="${esc(per.link)}" target="_blank" rel="noopener">open</a>` : ""}</div>
    <div class="sub">${issuer.relay ? "Live human: " + esc(issuer.relay.result) + " (sandbox: a sandbox claim passes with nobody present)" : 'Live human check (sandbox) · <a href="/relay/" target="_blank" rel="noopener">open</a>'}</div>
    <div class="sub">${esc(sl.text)}</div>
    ${sl.rows.length ? `<details><summary>Sentences</summary><ul class="plain">${sl.rows.map((r) => `<li class="stack"><span><span class="tag ${r.verdict === "verified" ? "ok" : r.verdict === "conflict" ? "bad" : ""}">${esc(r.verdict)}</span>${r.blocks ? "" : ' <span class="tag">advisory</span>'}</span><span>${esc(r.sentence)}</span>${r.source && r.source.version_id ? `<span class="sub">against ${esc(r.source.title || "the " + O())}, version ${esc(r.source.version_num || String(r.source.version_id).slice(0, 8))}${r.source.version_num == null && r.source.latest_version_id ? " (an older version)" : ""}</span>` : ""}${r.moved_from_order ? `<span class="sub">changed from the ${esc(O())}</span>` : ""}</li>`).join("")}</ul></details>` : ""}</div>
    <div class="rule"></div>
    <div class="stack"><div class="cap">What you sign</div>${codeBlock(canon.hash)}
    <div class="sub" style="color:${canon.match ? "var(--ok)" : "var(--bad)"}">${canon.match ? "✓ Same code as the laptop. This phone worked it out from the sheet above." : "This phone computed a different hash from the one the server sent. It will not sign."}</div></div></div>
    <button class="act primary big" id="sign" ${canon.match && buyable ? "" : "disabled"}>${armed(Date.now(), armedUntil, armedHash, hashNow()) ? "Tap again to sign" : "Sign"}</button>
    ${signNote ? `<div class="sub" style="color:var(--bad)">Not signed: ${esc(signNote)}</div>` : ""}`);
  main.querySelectorAll("details[data-why]").forEach((d) => { d.open = openWhy.has(d.dataset.why); d.addEventListener("toggle", () => (d.open ? openWhy.add(d.dataset.why) : openWhy.delete(d.dataset.why))); });
  ensureSenso();
  $("#pstart").onclick = async () => {
    try {
      persona = per.inquiry_id ? await getJSON("/api/issuer/persona/status") : await signedRequest("persona_start", {});   // a new inquiry is a signed request
      await refreshIssuer(); renderSheet(); if (!persona.link && !persona.inquiry_id) toast(persona.reason || persona.label);
    } catch (e) { toast(e.message); }
  };
  $("#sign").onclick = async () => {
    const btn = $("#sign"), seen = hashNow();
    if (!armed(Date.now(), armedUntil, armedHash, seen)) {   // the first tap arms the button; a second tap within four seconds, on the same sheet, signs
      armedUntil = Date.now() + 4000; armedHash = seen; btn.textContent = "Tap again to sign";
      setTimeout(() => { if ($("#sign") && !busy && Date.now() >= armedUntil) $("#sign").textContent = "Sign"; }, 4100);
      return;
    }
    armedUntil = 0; armedHash = null; signNote = "";
    busy = true; btn.disabled = true; btn.textContent = "Signing…";
    try { await signedRequest("sign_sheet", { sheet_hash: seen }); await loadState(); busy = false; renderSheet(); }
    catch (e) { busy = false; signNote = e.message; await loadState().catch(() => {}); renderSheet(); }
  };
}

/* adjust a limit: the order's value is the default; a slider overrides it, at most ten signed moves a second */
const sendQ = { latest: new Map(), running: false, last: 0 };
function queueLimit(id, value) { sendQ.latest.set(id, value); pump(); }
async function pump() {
  if (sendQ.running) return;
  sendQ.running = true;
  try {
    while (sendQ.latest.size) {
      const wait = 100 - (Date.now() - sendQ.last);
      if (wait > 0) await new Promise((r) => setTimeout(r, wait));
      const [id, value] = sendQ.latest.entries().next().value;
      sendQ.latest.delete(id); sendQ.last = Date.now();
      try { await signedRequest("set_limit", { limit_id: id, value }); } catch (e) { handleError(e); }
    }
  } finally { sendQ.running = false; }
}
function handleError(e) {
  if (e.code === "stale_hash") { toast("The sheet changed after you looked. Check it and sign again."); loadState().then(() => { if (tab === "sheet") renderSheet(); }); }
  else if (e.code === "replayed_seq") { /* an older move arrived late; the newest wins */ }
  else if (e.code === "no_key" || e.code === "unsigned") { toast(e.message); refreshIssuer().then(render); }
  else toast(e.message);
}
function issuerLimits() { const out = []; for (const line of state.sheet.lines) for (const l of line.limits) if (l.bound.source === "issuer") out.push({ line, limit: l }); return out; }
function renderAdjust() {
  const main = show(`<div class="sub">Override a ${LIM()} from the ${O()}. The sheet re-picks at once, and the ${LIM()} is marked as changed.</div>` +
    issuerLimits().map(({ line, limit }) => `<div class="item" data-limit="${esc(limit.id)}">
      <button class="lim" style="color:var(--t1)" data-open="${esc(limit.id)}"><span class="row"><span><span class="need">${esc(line.need)}</span> <span class="sub">${esc(limit.label)}</span></span><span class="num"><span class="v"></span> ${esc(limit.unit)}</span></span></button>
      <div class="body stack" ${openLimit === limit.id ? "" : "hidden"}>
        <input type="range" min="${limit.bound.min}" max="${limit.bound.max}" step="${limit.bound.step}" aria-label="${esc(line.need)}: ${esc(limit.label)}" ${signed ? "disabled" : ""}>
        <div class="sub order-note"></div><div class="sub pickline"></div>
        <div class="btns"><button class="act" data-back="${esc(limit.id)}" hidden>Back to the ${O()}</button></div>
      </div></div>`).join(""));
  main.querySelectorAll("[data-limit]").forEach((row) => {
    const id = row.dataset.limit, input = $("input", row);
    input.addEventListener("input", () => { $(".v", row).textContent = fmt(+input.value); queueLimit(id, +input.value); });
    input.addEventListener("pointerdown", () => dragging.add(id));
    const up = () => dragging.delete(id);
    ["pointerup", "pointercancel", "blur", "change"].forEach((ev) => input.addEventListener(ev, up));
  });
  updateAdjust();
}
function updateAdjust() {
  for (const { line, limit } of issuerLimits()) {
    const row = $('[data-limit="' + limit.id + '"]'); if (!row) continue;
    const input = $("input", row), fo = limit.from_order;
    if (!dragging.has(limit.id) && !sendQ.latest.has(limit.id)) { input.value = limit.bound.value; $(".v", row).textContent = fmt(limit.bound.value); }
    input.disabled = signed;
    const differs = fo && fo.matches === false;
    $(".order-note", row).innerHTML = fo ? (differs ? '<span style="color:var(--t1);font-weight:500;text-decoration:underline;text-underline-offset:3px">changed from the ' + esc(O()) + '</span> · the ' + esc(O()) + ' says ' + fmt(fo.value) + " " + esc(limit.unit) : "from the " + O() + ": " + fmt(fo.value) + " " + esc(limit.unit)) : "";
    const back = $("[data-back]", row); back.hidden = !(differs && !signed);
    const L = lineOf(line.id), p = pickOf(L);
    $(".pickline", row).textContent = p ? "Pick now: " + p.product.title + " · " + p.product.store + " · " + money(p.product.price_cents) : (L ? L.status + (L.reason ? ": " + L.reason : "") : "");
  }
}

/* lines: strike the picked product, with a reason */
const REASONS = () => ["Not suitable", "Does not fit the plan", "Not what the " + O() + " asks for"];
function renderLines() {
  show(`<div class="sub">Strike a pick with a reason. A strike holds at every store and ${esc(shopperName())} cannot undo it.</div>` + state.lines.map((L) => {
    const p = pickOf(L), struck = L.struck || [];
    return `<div class="item" data-line="${esc(L.line_id)}"><div class="row"><span class="need">${esc(L.need)}</span><span class="num">${p ? money(p.product.price_cents) : ""}</span></div>
      ${p ? `<div class="pick">${esc(p.product.title)}</div><div class="sub">${esc(p.product.store)}</div>` : `<div class="sub">${esc(L.reason || "nothing to pick")}</div>`}
      ${p && !signed ? `<div class="btns"><button class="act danger" data-strike="${esc(L.line_id)}">Strike…</button></div>
        <div class="strikebox stack" hidden><div class="chips">${REASONS().map((r) => `<button type="button" data-chip="${esc(r)}">${esc(r)}</button>`).join("")}</div>
        <input type="text" placeholder="Reason" maxlength="160" aria-label="Reason for the strike"><button class="act danger" data-confirm="${esc(L.line_id)}">Strike this product</button></div>` : ""}
      ${struck.map((x) => `<div class="sub">Struck: ${esc(x.product_key)}, ${esc(x.reason)}${signed ? "" : ` · <button class="link" data-unstrike="${esc(L.line_id)}" data-key="${esc(x.product_key)}">put back</button>`}</div>`).join("")}</div>`;
  }).join(""));
}
document.addEventListener("click", async (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-selected", b === t)); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.askAccept) { const a = ((issuer && issuer.asks) || []).find((x) => x.id === t.dataset.askAccept); if (a) answerAsk(t, "set_limit", { limit_id: a.limit_id, value: a.to, ask_id: a.id }); return; }
  if (t.dataset.askDecline) { answerAsk(t, "decline_ask", { ask_id: t.dataset.askDecline }); return; }
  if (t.dataset.lim) { shown.has(t.dataset.lim) ? shown.delete(t.dataset.lim) : shown.add(t.dataset.lim); renderSheet(); return; }
  if (t.dataset.open) { openLimit = openLimit === t.dataset.open ? null : t.dataset.open; document.querySelectorAll("[data-limit] .body").forEach((b) => (b.hidden = b.parentElement.dataset.limit !== openLimit)); return; }
  if (t.dataset.back) {
    const l = issuerLimits().find((x) => x.limit.id === t.dataset.back).limit;
    queueLimit(l.id, l.from_order.value); return;
  }
  if (t.dataset.strike) { const box = t.closest(".item").querySelector(".strikebox"); box.hidden = !box.hidden; if (!box.hidden) $("input", box).focus(); return; }
  if (t.dataset.chip) { $("input", t.closest(".strikebox")).value = t.dataset.chip; return; }
  if (t.dataset.confirm) {
    const L = lineOf(t.dataset.confirm), p = pickOf(L), reason = $("input", t.closest(".strikebox")).value.trim();
    if (!reason) return toast("Give a reason for the strike");
    t.disabled = true;
    try { await signedRequest("strike", { line_id: L.line_id, product_key: p.product.product_key, reason }); await loadState(); renderLines(); }
    catch (err) { handleError(err); t.disabled = false; }
    return;
  }
  if (t.dataset.unstrike) {
    t.disabled = true;
    try { await signedRequest("unstrike", { line_id: t.dataset.unstrike, product_key: t.dataset.key }); await loadState(); renderLines(); }
    catch (err) { handleError(err); t.disabled = false; }
  }
});
boot().catch((e) => { show('<div class="card"><div class="need">Could not start</div><div class="sub">' + esc(e.message) + "</div></div>", true); });
</script>
